name: duck_camera_picker
description: 取色鸭相机取色版 — 以取色鸭桌面端 UI 为原型，用相机实时取色的 Flutter 应用。
publish_to: "none"
version: 0.3.1+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  image: ^4.5.4
  vector_math: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  camera_platform_interface: ^2.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
