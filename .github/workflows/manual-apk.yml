name: Manual APK Build

# 手动触发打 APK：只构建并上传为 workflow artifact，
# 不创建 tag、不发布 GitHub Release。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/DuckCameraPicker-manual-${SHA}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DuckCameraPicker-apk
          path: build/app/outputs/flutter-apk/DuckCameraPicker-*.apk
